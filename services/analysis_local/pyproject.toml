[project]
name = "photos-analysis-local"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.53.0",
    "pydantic==2.13.5",
    "numpy>=2.5.3,<3.0",
    "open-clip-torch>=3.3.0,<4.0",
    "pillow>=12.3.0,<13.0",
    "torch>=2.14.0,<3.0",
]

[dependency-groups]
# Tests exercise the service and index without downloading model weights or CUDA.
dev = ["fastapi", "numpy", "httpx2", "pip-audit==2.10.1"]
