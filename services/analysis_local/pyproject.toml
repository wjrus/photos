[project]
name = "photos-analysis-local"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.54.0",
    "pydantic==2.13.5",
    "numpy>=2.5.3,<3.0",
    "open-clip-torch>=3.3.0,<4.0",
    "pillow>=12.3.0,<13.0",
    "torch>=2.14.0,<3.0",
    "torchvision>=0.29.1,<1.0",
]

# The Linux production sidecar runs on CPU. Use matching CPU wheels for both
# packages; macOS/Windows retain their existing PyPI builds.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
# Tests exercise the service and index without downloading model weights or CUDA.
dev = ["fastapi", "numpy", "httpx2", "pip-audit==2.10.1"]
