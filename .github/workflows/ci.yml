name: CI

on:
  pull_request:
  push:
    branches: [ main ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  scan_ruby:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Scan for common Rails security vulnerabilities using static analysis
        run: bin/brakeman --no-pager

      - name: Scan for known security vulnerabilities in gems used
        run: bin/bundler-audit

  scan_python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/analysis_local

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: services/analysis_local/uv.lock

      - name: Install locked test and audit dependencies
        run: uv sync --locked --only-dev

      - name: Test the analysis service and persistent search index
        run: uv run --locked --only-dev python -m unittest discover -s tests -v

      - name: Scan for known security vulnerabilities in Python packages
        run: |
          uv export --locked --no-dev --no-emit-project --format requirements-txt --output-file /tmp/analysis-requirements.txt
          uv run --locked --only-dev pip-audit --disable-pip --require-hashes -r /tmp/analysis-requirements.txt
          # Vendor +cpu releases are not published on PyPI. Audit them through
          # OSV as well; uv verifies the locked wheel hashes during installation.
          uv run --locked --only-dev pip-audit --vulnerability-service osv --disable-pip --require-hashes -r /tmp/analysis-requirements.txt
          uv run --locked --only-dev pip-audit

  check_containers:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        include:
          - image: rails
            context: .
            tag: photos:ci
          - image: analysis
            context: services/analysis_local
            tag: photos-analysis-local:ci
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Check container builds
        run: docker build --check ${{ matrix.context }}

      - name: Build production images
        run: docker build --tag ${{ matrix.tag }} ${{ matrix.context }}

      - name: Check CPU analysis runtime without downloading model weights
        if: matrix.image == 'analysis'
        run: |
          docker run --rm -i --env OPENCLIP_WARM_ON_START=false photos-analysis-local:ci python - <<'PY'
          from importlib.metadata import distributions

          import open_clip
          import torch
          from PIL import Image
          from torchvision.ops import nms
          from app.main import health

          assert torch.version.cuda is None
          assert not torch.cuda.is_available()
          gpu_packages = [
              package.metadata["Name"] for package in distributions()
              if package.metadata["Name"].lower().startswith(("nvidia-", "cuda-"))
              or package.metadata["Name"].lower() == "triton"
          ]
          assert not gpu_packages, gpu_packages
          assert health()["status"] == "ok"
          assert nms(torch.tensor([[0., 0., 1., 1.]]), torch.tensor([1.]), 0.5).tolist() == [0]

          torch.set_num_threads(2)
          model, _, preprocess = open_clip.create_model_and_transforms("ViT-B-32", pretrained=None, device="cpu")
          model.eval()
          tokens = open_clip.get_tokenizer("ViT-B-32")(["synthetic test photo"])
          with torch.inference_mode():
              image_features = model.encode_image(preprocess(Image.new("RGB", (32, 32))).unsqueeze(0))
              text_features = model.encode_text(tokens)
          for features in (image_features, text_features):
              assert features.shape == (1, 512)
              assert features.device.type == "cpu"
              assert torch.isfinite(features).all()
          PY

      - name: Check deployment script syntax
        run: bash -n scripts/deploy

  scan_js:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Scan for security vulnerabilities in JavaScript dependencies
        run: bin/importmap audit

  lint:
    runs-on: ubuntu-latest
    env:
      RUBOCOP_CACHE_ROOT: tmp/rubocop
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Prepare RuboCop cache
        uses: actions/cache@v6
        env:
          DEPENDENCIES_HASH: ${{ hashFiles('.ruby-version', '**/.rubocop.yml', '**/.rubocop_todo.yml', 'Gemfile.lock') }}
        with:
          path: ${{ env.RUBOCOP_CACHE_ROOT }}
          key: rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-${{ github.ref_name == github.event.repository.default_branch && github.run_id || 'default' }}
          restore-keys: |
            rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-

      - name: Lint code for consistent style
        run: bin/rubocop -f github

  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: --health-cmd="pg_isready" --health-interval=10s --health-timeout=5s --health-retries=3

      # redis:
      #   image: valkey/valkey:8
      #   ports:
      #     - 6379:6379
      #   options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - name: Install packages
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libpq-dev libvips

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Run tests
        env:
          RAILS_ENV: test
          DATABASE_URL: postgres://postgres:postgres@localhost:5432
          # RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
          # REDIS_URL: redis://localhost:6379/0
        run: bin/rails db:test:prepare test

  system-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: --health-cmd="pg_isready" --health-interval=10s --health-timeout=5s --health-retries=3

      # redis:
      #   image: valkey/valkey:8
      #   ports:
      #     - 6379:6379
      #   options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - name: Install packages
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libpq-dev libvips

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Run System Tests
        env:
          RAILS_ENV: test
          DATABASE_URL: postgres://postgres:postgres@localhost:5432
          # RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
          # REDIS_URL: redis://localhost:6379/0
        run: bin/rails db:test:prepare test:system

      - name: Keep screenshots from failed system tests
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: screenshots
          path: ${{ github.workspace }}/tmp/screenshots
          if-no-files-found: ignore
