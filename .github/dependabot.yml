version: 2
updates:
- package-ecosystem: bundler
  directory: "/"
  schedule:
    interval: weekly
  open-pull-requests-limit: 10
- package-ecosystem: github-actions
  directory: "/"
  schedule:
    interval: weekly
  open-pull-requests-limit: 10
- package-ecosystem: uv
  directory: "/services/analysis_local"
  schedule:
    interval: weekly
  open-pull-requests-limit: 10
- package-ecosystem: docker
  directories:
    - "/"
    - "/services/analysis_local"
  schedule:
    interval: weekly
  open-pull-requests-limit: 10
- package-ecosystem: docker-compose
  directory: "/"
  schedule:
    interval: weekly
  open-pull-requests-limit: 10
